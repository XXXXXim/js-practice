    const studentNames = ['John', 'Alice', 'Bob']
    const studentAges = {

    }

    for (let i =0; i<studentNames.length; i++) {
      const age = studentAges[studentNames[i]]
      const message = `${studentNames[i]}은 ${studentAges[studentNames[i]]}살입니다.`
      if (age >=50) {
        console.log(message)
      }
    }
  </script>
